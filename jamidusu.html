<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자미두수 명반 - 紫微斗數</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
  --accent: #e94560; --gold: #f0c040; --text: #eee; --text-dim: #999;
  --purple: #9d4edd; --blue: #3a86ff; --green: #06ffa5;
}
body {
  font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-user-select: none; user-select: none;
}
.header {
  background: linear-gradient(135deg, var(--purple), var(--surface2));
  padding: 20px; text-align: center; border-bottom: 2px solid var(--purple);
}
.header h1 { font-size: 1.8em; font-weight: 900; color: var(--gold); }
.header h1 span { font-size: 0.5em; color: var(--text-dim); display: block; margin-top: 4px; font-weight: 300; }
.nav {
  display: flex; justify-content: center; gap: 8px; padding: 12px;
  background: var(--surface); border-bottom: 1px solid #333;
}
.nav a {
  color: var(--text-dim); text-decoration: none; padding: 6px 14px;
  border-radius: 4px; font-size: 0.85em; border: 1px solid #333; transition: all .2s;
}
.nav a:hover, .nav a.active { color: var(--purple); border-color: var(--purple); }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* 명반 그리드 */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 180px);
  gap: 8px;
  margin: 24px 0;
  max-width: 900px;
  margin: 24px auto;
}

.palace-cell {
  background: var(--surface);
  border: 2px solid #333;
  border-radius: 8px;
  padding: 10px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}

.palace-cell:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(157, 78, 221, 0.3);
}

.palace-cell.ming {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(240, 192, 64, 0.1), var(--surface));
}

.palace-cell.shen {
  border-color: var(--blue);
  background: linear-gradient(135deg, rgba(58, 134, 255, 0.1), var(--surface));
}

.palace-header {
  font-size: 0.85em;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.palace-name { color: var(--gold); }
.palace-hanja { font-size: 0.7em; color: var(--text-dim); }

.palace-badge {
  font-size: 0.6em;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 700;
}

.badge-ming { background: rgba(240, 192, 64, 0.2); color: var(--gold); }
.badge-shen { background: rgba(58, 134, 255, 0.2); color: var(--blue); }

.star-list {
  font-size: 0.75em;
  line-height: 1.6;
}

.star-item {
  padding: 2px 0;
  color: #ddd;
}

.star-main {
  color: var(--purple);
  font-weight: 700;
}

.star-lucky { color: var(--green); }
.star-unlucky { color: var(--accent); }

/* 분석 카드 */
.analysis-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid #333;
}

.analysis-card h3 {
  font-size: 1.1em;
  color: var(--purple);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.analysis-card p {
  font-size: 0.9em;
  line-height: 1.7;
  color: #ddd;
  margin-bottom: 8px;
}

.score-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid var(--purple);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 20px auto;
}

.score-circle .num {
  font-size: 2.2em;
  font-weight: 900;
  color: var(--purple);
}

.score-circle .lbl {
  font-size: 0.75em;
  color: var(--text-dim);
}

.input-section {
  background: var(--surface);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 24px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}

.form-field label {
  display: block;
  font-size: 0.8em;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.form-field input,
.form-field select {
  width: 100%;
  padding: 8px;
  border: 1px solid #444;
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.9em;
}

.form-field input:focus,
.form-field select:focus {
  border-color: var(--purple);
  outline: none;
}

.btn-primary {
  width: 100%;
  padding: 12px;
  background: var(--purple);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary:hover {
  background: #8b3cc9;
  transform: translateY(-1px);
}

.result-section { display: none; }

.footer {
  text-align: center;
  padding: 20px;
  font-size: 0.75em;
  color: var(--text-dim);
}

@media (max-width: 800px) {
  .chart-grid {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 160px);
  }
}

@media (max-width: 600px) {
  .chart-grid {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(6, 140px);
  }
}
</style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;" oncopy="return false;" oncut="return false;">

<div class="header">
  <h1>자미두수 명반<span>紫微斗數 - 중국 천문 점성술</span></h1>
</div>

<div class="nav">
  <a href="index.html">만세력</a>
  <a href="unsebogi.html">운세보기</a>
  <a href="gunghap.html">궁합</a>
  <a href="daily.html">오늘의 운세</a>
  <a href="jamidusu.html" class="active">자미두수</a>
</div>

<div class="container">
  <div class="input-section">
    <h3 style="color:var(--gold);margin-bottom:16px">생년월일시 입력</h3>
    <div class="form-grid">
      <div class="form-field">
        <label>출생년도 (양력)</label>
        <input type="number" id="birth_year" min="1900" max="2100" value="1990">
      </div>
      <div class="form-field">
        <label>출생월</label>
        <select id="birth_month"></select>
      </div>
      <div class="form-field">
        <label>출생일</label>
        <select id="birth_day"></select>
      </div>
      <div class="form-field">
        <label>출생시</label>
        <select id="birth_hour"></select>
      </div>
      <div class="form-field">
        <label>성별</label>
        <select id="gender">
          <option value="M">남성</option>
          <option value="F">여성</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" onclick="calculateJamidusu()">자미두수 명반 보기</button>
    <p style="font-size:0.75em;color:var(--text-dim);margin-top:8px;">
      ※ 자미두수는 음력 기준으로 계산됩니다. 양력 입력 시 자동 변환됩니다.
    </p>
  </div>

  <div class="result-section" id="resultArea"></div>
</div>

<div class="footer">자미두수 명반 &copy; 2026 | 참고용 분석 (오락 목적)</div>

<script src="timezone-lunar.js"></script>
<script src="jamidusu.js"></script>
<script>
// 초기화
function init() {
  const monthSel = document.getElementById('birth_month');
  for (let i = 1; i <= 12; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + '월';
    monthSel.appendChild(opt);
  }

  const daySel = document.getElementById('birth_day');
  for (let i = 1; i <= 31; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + '일';
    daySel.appendChild(opt);
  }

  const hourSel = document.getElementById('birth_hour');
  for (let i = 0; i < 24; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + '시';
    hourSel.appendChild(opt);
  }
}

init();

function calculateJamidusu() {
  const year = parseInt(document.getElementById('birth_year').value);
  const month = parseInt(document.getElementById('birth_month').value);
  const day = parseInt(document.getElementById('birth_day').value);
  const hour = parseInt(document.getElementById('birth_hour').value);
  const gender = document.getElementById('gender').value;

  // 양력 -> 음력 변환
  const lunar = solarToLunar(year, month, day);

  // 자미두수 명반 생성
  const chartData = generateJamidusuChart(lunar.year, lunar.month, lunar.day, hour, gender);

  // 종합 분석
  const analysis = analyzeJamidusu(chartData);

  // 렌더링
  renderJamidusuChart(chartData, analysis, year, month, day, lunar);
}

function renderJamidusuChart(chartData, analysis, solarYear, solarMonth, solarDay, lunar) {
  const { chart, mingPalace, shenPalace, birthInfo } = chartData;

  let html = '';

  // 기본 정보
  html += `<div style="text-align:center;margin-bottom:24px">`;
  html += `<h3 style="color:var(--gold);margin-bottom:8px">
    ${solarYear}년 ${solarMonth}월 ${solarDay}일 (양력) /
    음력 ${lunar.year}년 ${lunar.month}월 ${lunar.day}일${lunar.isLeapMonth ? ' (윤달)' : ''}
  </h3>`;
  html += `<p style="font-size:0.9em;color:var(--text-dim)">
    ${birthInfo.gender === 'M' ? '남성 ♂' : '여성 ♀'} · ${birthInfo.hour}시생
  </p>`;
  html += `</div>`;

  // 종합 점수
  html += `<div class="score-circle">`;
  html += `<div class="num">${analysis.overallScore}</div>`;
  html += `<div class="lbl">명반 점수</div>`;
  html += `</div>`;

  // 종합 요약
  html += `<div class="analysis-card">`;
  html += `<h3>🌟 종합 분석</h3>`;
  html += `<p>${analysis.summary}</p>`;
  html += `<p style="font-size:0.85em;color:var(--text-dim);margin-top:8px">`;
  html += `길성(吉星): ${analysis.luckyStars}개 | 흉성(凶星): ${analysis.unluckyStars}개`;
  html += `</p>`;
  html += `</div>`;

  // 명반 그리드
  html += `<div class="analysis-card">`;
  html += `<h3>📊 12궁 명반</h3>`;
  html += `<div class="chart-grid">`;

  // 12궁 배치 (시계 방향)
  const gridPositions = [3, 2, 1, 0, 4, 11, 5, 10, 6, 9, 7, 8];

  gridPositions.forEach(idx => {
    const p = chart[idx];
    const isMing = p.position === mingPalace;
    const isShen = p.position === shenPalace;

    html += `<div class="palace-cell ${isMing ? 'ming' : ''} ${isShen ? 'shen' : ''}">`;
    html += `<div class="palace-header">`;
    html += `<div><span class="palace-name">${p.palace.name}</span><br><span class="palace-hanja">${p.palace.hanja}</span></div>`;
    if (isMing) html += `<span class="palace-badge badge-ming">命</span>`;
    if (isShen) html += `<span class="palace-badge badge-shen">身</span>`;
    html += `</div>`;

    html += `<div class="star-list">`;
    if (p.mainStars.length > 0) {
      p.mainStars.forEach(s => {
        html += `<div class="star-item star-main">★ ${s.name}</div>`;
      });
    }
    if (p.auxStars.length > 0) {
      p.auxStars.forEach(s => {
        const cls = s.type === 'lucky' ? 'star-lucky' : 'star-unlucky';
        html += `<div class="star-item ${cls}">• ${s.name}</div>`;
      });
    }
    if (p.mainStars.length === 0 && p.auxStars.length === 0) {
      html += `<div style="color:var(--text-dim);font-size:0.7em">공궁</div>`;
    }
    html += `</div>`;
    html += `</div>`;
  });

  html += `</div>`;
  html += `<p style="font-size:0.8em;color:var(--text-dim);margin-top:12px">`;
  html += `💛 금색 테두리: 명궁(命宮) - 가장 중요한 본명의 궁 &nbsp;&nbsp; `;
  html += `💙 파란 테두리: 신궁(身宮) - 후천적 발전 방향`;
  html += `</p>`;
  html += `</div>`;

  // 궁위별 상세 해석
  html += `<div class="analysis-card">`;
  html += `<h3>📖 궁위별 상세 해석</h3>`;

  chart.forEach(p => {
    if (p.mainStars.length > 0 || p.isMing || p.isShen) {
      const interp = interpretPalace(p);
      html += `<div style="margin-bottom:16px;padding:12px;background:rgba(157,78,221,0.05);border-radius:8px">`;
      html += `<pre style="white-space:pre-wrap;font-family:'Noto Sans KR';font-size:0.85em;line-height:1.7;margin:0">${interp}</pre>`;
      html += `</div>`;
    }
  });

  html += `</div>`;

  // 안내 사항
  html += `<div class="analysis-card" style="background:rgba(240,192,64,0.05)">`;
  html += `<h3>💡 참고 사항</h3>`;
  html += `<p style="font-size:0.85em">`;
  html += `자미두수는 중국 송나라 시대에 발전한 천문 점성술로, 생년월일시를 기준으로 12개의 궁위에 별들을 배치하여 운명을 해석합니다. `;
  html += `이 분석은 전통 자미두수 이론을 바탕으로 한 간략화된 버전으로, 참고용으로만 활용하시기 바랍니다. `;
  html += `정확한 분석을 위해서는 전문가의 상담을 권장합니다.`;
  html += `</p>`;
  html += `</div>`;

  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = html;
  resultArea.style.display = 'block';
  resultArea.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
