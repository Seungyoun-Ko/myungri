<script>
// ============================================================
// 기초 데이터

const STEMS = ['갑','을','병','정','무','기','경','신','임','계'];
const STEMS_HANJA = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
const BRANCHES_HANJA = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const BRANCH_ANIMALS = ['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];

// 시진 (12 시진) - hour ranges
const HOUR_LABELS = [
  '자시 (23:00~01:00)', '축시 (01:00~03:00)', '인시 (03:00~05:00)',

// ============================================================
// 음력 데이터 (1900~2050)
// ============================================================
const LUNAR_DATA = [
  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
  0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
  0x14b63
];

function lunarMonthDays(year){
  const data=LUNAR_DATA[year-1900];const months=[];
  for(let i=0;i<12;i++)months.push((data>>(4+i))&1?30:29);
  return months;
}
function lunarLeapMonth(year){return LUNAR_DATA[year-1900]&0xf;}
function lunarLeapMonthDays(year){
  const leap=lunarLeapMonth(year);if(!leap)return 0;
  return(LUNAR_DATA[year-1900]>>16)&1?30:29;
}
function lunarYearDays(year){
  let total=0;const months=lunarMonthDays(year);
  for(let i=0;i<12;i++)total+=months[i];total+=lunarLeapMonthDays(year);return total;
}
function solarToLunar(sy,sm,sd){
  const baseDate=new Date(1900,0,31);const target=new Date(sy,sm-1,sd);
  let offset=Math.floor((target-baseDate)/86400000);
  let lunarYear=1900;let yearDays;
  while(lunarYear<2051&&offset>0){yearDays=lunarYearDays(lunarYear);if(offset<yearDays)break;offset-=yearDays;lunarYear++;}
  const leap=lunarLeapMonth(lunarYear);const months=lunarMonthDays(lunarYear);
  let lunarMonth=1;let isLeap=false;let monthDays;
  for(let i=0;i<12;i++){
    monthDays=months[i];if(offset<monthDays){lunarMonth=i+1;break;}offset-=monthDays;
    if(leap===(i+1)){monthDays=lunarLeapMonthDays(lunarYear);if(offset<monthDays){lunarMonth=i+1;isLeap=true;break;}offset-=monthDays;}
    if(i===11)lunarMonth=12;
  }
  return{year:lunarYear,month:lunarMonth,day:offset+1,isLeap};
}

// ============================================================
// 절기 계산
// ============================================================
function getJD(y,m,d){if(m<=2){y--;m+=12;}const A=Math.floor(y/100);const B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;}
function jdToDate(jd){jd+=0.5;const Z=Math.floor(jd);const F=jd-Z;let A;if(Z<2299161)A=Z;else{const a=Math.floor((Z-1867216.25)/36524.25);A=Z+1+a-Math.floor(a/4);}const B=A+1524;const C=Math.floor((B-122.1)/365.25);const D=Math.floor(365.25*C);const E=Math.floor((B-D)/30.6001);const day=B-D-Math.floor(30.6001*E)+F;const month=(E<14)?E-1:E-13;const year=(month>2)?C-4716:C-4715;return{year,month,day:Math.floor(day)};}
function getSunLongitude(jd){const T=(jd-2451545.0)/36525.0;let L0=280.46646+36000.76983*T+0.0003032*T*T;let M=357.52911+35999.05029*T-0.0001537*T*T;M=M*Math.PI/180;const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);let lon=L0+C;const omega=125.04-1934.136*T;lon=lon-0.00569-0.00478*Math.sin(omega*Math.PI/180);lon=((lon%360)+360)%360;return lon;}
function getSolarTermDate(year,termIndex){
  const targetLongitudes=[285,300,315,330,345,0,15,30,45,60,75,90,105,120,135,150,165,180,195,210,225,240,255,270];
  const targetLon=targetLongitudes[termIndex];
  const monthApprox=[1.05,1.20,2.04,2.19,3.06,3.21,4.05,4.20,5.06,5.21,6.06,6.21,7.07,7.23,8.07,8.23,9.08,9.23,10.08,10.23,11.07,11.22,12.07,12.22];
  const approxMonth=Math.floor(monthApprox[termIndex]);const approxDay=Math.round((monthApprox[termIndex]%1)*100);
  let jd=getJD(year,approxMonth,approxDay);
  for(let i=0;i<50;i++){const lon=getSunLongitude(jd);let diff=targetLon-lon;if(diff>180)diff-=360;if(diff<-180)diff+=360;if(Math.abs(diff)<0.0001)break;jd+=diff/360*365.25;}
  return jdToDate(jd);
}

// 년주 (입춘 기준)
function getYearStemBranch(year,month,day){
  const ipchun=getSolarTermDate(year,2);
  let adjYear=year;
  if(month<ipchun.month||(month===ipchun.month&&day<ipchun.day))adjYear--;
  const idx=((adjYear-4)%60+60)%60;
  return{stem:idx%10,branch:idx%12};
}

// ============================================================
// 명궁 위치 결정
// ============================================================
// 명궁: 음력 월(1~12)과 시진(0~11, 0=子) 기준
// 인궁(寅=2)에서 시작, 월수만큼 순행(+), 시진수만큼 역행(-)
function getMingGongBranch(lunarMonth, hourBranch){
  // 寅(2)에서 시작, 음력 월만큼 전진, 시진만큼 후퇴
  let pos = (2 + lunarMonth - 1 - hourBranch + 12*10) % 12;
  return pos;
}

// 신궁: 인궁에서 시작, 월수만큼 순행, 시진수만큼 순행
function getShenGongBranch(lunarMonth, hourBranch){
  let pos = (2 + lunarMonth - 1 + hourBranch) % 12;
  return pos;
}

// ============================================================
// 궁의 천간 결정
// ============================================================
function getPalaceStems(yearStem){
  // 년간에 따라 인궁(寅)의 천간이 결정됨
  const group = yearStem % 5; // 갑기=0, 을경=1, 병신=2, 정임=3, 무계=4
  const yinStem = YIN_START_STEM[group];
  const stems = new Array(12);
  for(let i=0;i<12;i++){
    // 寅=2 → index starts at branch 2
    stems[(2+i)%12] = (yinStem + i) % 10;
  }
  return stems; // branch → stem
}

// ============================================================
// 오행국 결정
// ============================================================
function getWuxingJu(mingGongBranch, palaceStems){
  const stem = palaceStems[mingGongBranch];
  // 60갑자 인덱스 = stem*12 + branch 가 아닌, 정확한 60甲子 인덱스를 계산
  // 60甲子에서 천간=stem, 지지=branch인 조합의 인덱스
  // stem과 branch가 같은 홀짝일 때만 유효한 조합
  // index = (stem * 6 + ((branch - stem + 12) % 12) / 2) ... 복잡함
  // 간단 공식: 60甲子 인덱스 = (stem + 10 - branch%10) * 6 + ...
  // 더 간단: 두 값의 차이로 계산
  const branch = mingGongBranch;
  // 60甲子 index 공식: index에서 index%10=stem, index%12=branch
  // 풀면: index = (6*stem - 5*branch + 60) % 60  ... 검증 필요
  // 실제 공식: 만약 stem과 branch가 같은 홀짝이면
  // index를 0-59에서 찾음
  let idx = -1;
  for(let i=0;i<60;i++){
    if(i%10===stem && i%12===branch){idx=i;break;}
  }
  if(idx===-1) idx=0;

  const nayinElement = NAYIN_OHENG[idx];
  return NAYIN_TO_JU[nayinElement];
}

// 주성 배치
// ============================================================
function placeMainStars(ziweiPos){
  const stars = {}; // branch → [star names]
  for(let i=0;i<12;i++) stars[i]=[];

  // 자미 계열
  const zwSeries = ZIWEI_SERIES[ziweiPos];
  for(let i=0;i<MAIN_STAR_NAMES_ZW.length;i++){
    stars[zwSeries[i]].push({name:MAIN_STAR_NAMES_ZW[i],type:'main'});
  }

  // 천부 계열
  const tfPos = TIANFU_FROM_ZIWEI[ziweiPos];
  for(let i=0;i<MAIN_STAR_NAMES_TF.length;i++){
    const pos = (tfPos + TIANFU_OFFSETS[i]) % 12;
    stars[pos].push({name:MAIN_STAR_NAMES_TF[i],type:'main'});
  }

  return stars;
}

// ============================================================
// 보성 배치
// ============================================================
function placeAuxStars(stars, yearStem, yearBranch, lunarMonth, hourBranch){
  // 문창
  stars[WENCHANG_POS[hourBranch]].push({name:'문창',type:'aux'});
  // 문곡
  stars[WENQU_POS[hourBranch]].push({name:'문곡',type:'aux'});
  // 좌보
  stars[ZUOFU_POS[lunarMonth-1]].push({name:'좌보',type:'aux'});
  // 우필
  stars[YOUBI_POS[lunarMonth-1]].push({name:'우필',type:'aux'});
  // 록존
  const lucunPos = LUCUN_POS[yearStem];
  stars[lucunPos].push({name:'록존',type:'lucun'});
  // 경양 (록존+1)
  stars[(lucunPos+1)%12].push({name:'경양',type:'sha'});
  // 타라 (록존-1)
  stars[(lucunPos+11)%12].push({name:'타라',type:'sha'});
  // 천괴
  stars[TIANKUI_POS[yearStem]].push({name:'천괴',type:'aux'});
  // 천월
  stars[TIANYUE_POS[yearStem]].push({name:'천월',type:'aux'});
  // 천마
  stars[TIANMA_POS[yearBranch]].push({name:'천마',type:'aux'});
  // 화성
  const hStart = HUOXING_START[yearBranch];
  const hPos = (hStart + hourBranch) % 12;
  stars[hPos].push({name:'화성',type:'sha'});
  // 영성
  const lStart = LINGXING_START[yearBranch];
  const lPos = (lStart + hourBranch) % 12;
  stars[lPos].push({name:'영성',type:'sha'});
}

// ============================================================
// 잡성 배치
// ============================================================
function placeExtraStars(stars, yearBranch, lunarMonth, hourBranch){
  // 천공
  const tkPos = (11 - hourBranch + 12) % 12;
  stars[tkPos].push({name:'천공',type:'misc'});
  // 지겁 (천공 대궁)
  stars[(tkPos+6)%12].push({name:'지겁',type:'misc'});
  // 천형
  stars[TIANXING_POS[lunarMonth-1]].push({name:'천형',type:'sha'});
  // 천요
  stars[TIANYAO_POS[lunarMonth-1]].push({name:'천요',type:'misc'});
  // 홍란
  stars[HONGLAN_POS[yearBranch]].push({name:'홍란',type:'misc'});
  // 천희
  stars[TIANXI_POS[yearBranch]].push({name:'천희',type:'misc'});
  // 천덕
  stars[TIANDE_POS[lunarMonth-1]].push({name:'천덕',type:'aux'});
  // 월덕
  stars[YUEDE_POS[lunarMonth-1]].push({name:'월덕',type:'aux'});
  // 천상
  stars[TIANSHANG_POS[lunarMonth-1]].push({name:'천상성',type:'misc'});
  // 천사
  stars[TIANSHI_POS[lunarMonth-1]].push({name:'천사성',type:'misc'});
}

// ============================================================
// 사화(四化) 배치
// ============================================================
function placeSihua(stars, yearStem){
  const sihuaStars = SIHUA_TABLE[yearStem]; // [화록성, 화권성, 화과성, 화기성]
  const sihuaMap = {}; // starName → sihua type index
  sihuaStars.forEach((starName, idx) => {
    if(!sihuaMap[starName]) sihuaMap[starName] = [];
    sihuaMap[starName].push(idx);
  });
  // 각 궁의 성에 사화 마킹
  for(let b=0;b<12;b++){
    stars[b].forEach(star => {
      if(sihuaMap[star.name]){
        star.sihua = sihuaMap[star.name]; // array of sihua indices
      }
    });
  }
  return sihuaMap;
}

// ============================================================
// 묘왕평한함 밝기 계산
// ============================================================
function applyBrightness(stars){
  for(let b=0;b<12;b++){
    stars[b].forEach(star => {
      if(star.type === 'main' && BRIGHTNESS_TABLE[star.name]){
        star.brightness = BRIGHTNESS_TABLE[star.name][b];
      }
    });
  }
}

// ============================================================
// 음력 → 양력 역변환 (간략)
// ============================================================
function lunarToSolar(ly, lm, ld, isLeap){
  const baseDate = new Date(1900, 0, 31);
  let offset = 0;
  for(let y=1900; y<ly; y++) offset += lunarYearDays(y);
  const months = lunarMonthDays(ly);
  const leap = lunarLeapMonth(ly);
  for(let i=0; i<lm-1; i++){
    offset += months[i];
    if(leap === (i+1)) offset += lunarLeapMonthDays(ly);
  }
  if(isLeap && leap === lm) offset += months[lm-1];
  offset += ld - 1;
  const result = new Date(baseDate.getTime() + offset * 86400000);
  return { year: result.getFullYear(), month: result.getMonth()+1, day: result.getDate() };
}

// ============================================================
// 대한(大限) 계산
// ============================================================
function getDaehan(mingGongBranch, wuxingJu, yearStem, gender){
  // 대한 시작 나이 = 오행국 수 + 1 (실제로는 국수에 따라 다름)
  // 수이국=2세, 목삼국=3세, 금사국=4세, 토오국=5세, 화육국=6세 시작
  // 양남음녀 순행, 음남양녀 역행
  const isYangStem = yearStem % 2 === 0;
  const isMale = gender === 'M';
  const forward = (isYangStem && isMale) || (!isYangStem && !isMale);

  const startAge = wuxingJu;
  const periods = [];
  let currentBranch = mingGongBranch;

  for(let i=0;i<12;i++){
    const fromAge = startAge + i*10;
    const toAge = fromAge + 9;
    periods.push({
      branch: currentBranch,
      branchName: BRANCHES_HANJA[currentBranch],
      fromAge, toAge
    });
    if(forward) currentBranch = (currentBranch + 1) % 12;
    else currentBranch = (currentBranch + 11) % 12;
  }
  return periods;
}

// ============================================================
// 메인 계산 함수
// ============================================================
function calculate(){
  let sy = parseInt(document.getElementById('inputYear').value);
  let sm = parseInt(document.getElementById('inputMonth').value);
  let sd = parseInt(document.getElementById('inputDay').value);
  const hourBranch = parseInt(document.getElementById('inputHour').value);
  const gender = document.querySelector('input[name="gender"]:checked').value;
  const calType = document.querySelector('input[name="calType"]:checked').value;

  let lunar;
  if(calType === 'lunar'){
    // 음력 입력: 역변환하여 양력 구하기
    lunar = { year: sy, month: sm, day: sd, isLeap: false };
    const solar = lunarToSolar(sy, sm, sd, false);
    sy = solar.year; sm = solar.month; sd = solar.day;
  } else {
    // 양력 → 음력
    lunar = solarToLunar(sy, sm, sd);
  }

  // 년주 (입춘 기준)
  const yearPillar = getYearStemBranch(sy, sm, sd);
  const yearStem = yearPillar.stem;
  const yearBranch = yearPillar.branch;

  // 궁의 천간
  const palaceStems = getPalaceStems(yearStem);

  // 명궁 위치
  const mingGong = getMingGongBranch(lunar.month, hourBranch);

  // 신궁 위치
  const shenGong = getShenGongBranch(lunar.month, hourBranch);

  // 오행국
  const wuxingJu = getWuxingJu(mingGong, palaceStems);
  const juNames = {2:'수이국(水二局)',3:'목삼국(木三局)',4:'금사국(金四局)',5:'토오국(土五局)',6:'화육국(火六局)'};

  // 자미성 위치
  const lunarDay = Math.min(lunar.day, 30);
  const ziweiPos = ZIWEI_TABLE[wuxingJu][lunarDay-1];

  // 12궁 배정 (명궁부터 역행)
  const palaces = new Array(12); // branch → palace index
  for(let i=0;i<12;i++){
    const branch = (mingGong - i + 12) % 12;
    palaces[branch] = i;
  }

  // 주성 배치
  const stars = placeMainStars(ziweiPos);

  // 보성 배치
  placeAuxStars(stars, yearStem, yearBranch, lunar.month, hourBranch);

  // 잡성 배치
  placeExtraStars(stars, yearBranch, lunar.month, hourBranch);

  // 묘왕평한함 밝기 적용
  applyBrightness(stars);

  // 사화(四化) 배치
  const sihuaMap = placeSihua(stars, yearStem);

  // 대한 계산
  const daehan = getDaehan(mingGong, wuxingJu, yearStem, gender);

  // ============================================================
  // 렌더링
  // ============================================================
  renderChart(palaces, palaceStems, stars, mingGong, shenGong, lunar, sy, sm, sd, hourBranch, gender, yearStem, yearBranch, wuxingJu, juNames, ziweiPos, daehan, sihuaMap);
}

function renderChart(palaces, palaceStems, stars, mingGong, shenGong, lunar, sy, sm, sd, hourBranch, gender, yearStem, yearBranch, wuxingJu, juNames, ziweiPos, daehan, sihuaMap){
  const container = document.getElementById('chartContainer');

  // Build 4x4 grid
  let html = '<div class="chart-grid">';

  // Grid layout:
  // row0: branch 5,6,7,8
  // row1: branch 4, [center], [center], branch 9
  // row2: branch 3, [center], [center], branch 10
  // row3: branch 2, 1, 0, 11

  const gridOrder = [
    [5,6,7,8],
    [4,-1,-1,9],
    [3,-1,-1,10],
    [2,1,0,11]
  ];

  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const branch = gridOrder[r][c];
      if(branch===-1){
        // Center cells
        if(r===1&&c===1){
          // Render center info spanning 2x2
          html += renderCenterInfo(lunar, sy, sm, sd, hourBranch, gender, yearStem, yearBranch, wuxingJu, juNames, ziweiPos, mingGong, shenGong, palaceStems);
        }
        // skip other center cells (handled by grid-column/grid-row span)
        continue;
      }
      html += renderPalaceCell(branch, palaces, palaceStems, stars, mingGong, shenGong);
    }
  }
  html += '</div>';
  container.innerHTML = html;

  // Analysis section
  renderAnalysis(palaces, stars, mingGong, shenGong, daehan, palaceStems, lunar, sy);
}

function renderCenterInfo(lunar, sy, sm, sd, hourBranch, gender, yearStem, yearBranch, wuxingJu, juNames, ziweiPos, mingGong, shenGong, palaceStems){
  const genderStr = gender==='M'?'남(男)':'여(女)';
  return `<div class="center-info">

    <div class="info-line">

      <strong>음력:</strong> ${lunar.year}년 ${lunar.isLeap?'윤':''}${lunar.month}월 ${lunar.day}일<br>

      <strong>명궁:</strong> ${BRANCHES_HANJA[mingGong]}궁 (${STEMS_HANJA[palaceStems[mingGong]]}${BRANCHES_HANJA[mingGong]})<br>
      <strong>신궁:</strong> ${BRANCHES_HANJA[shenGong]}궁<br>

      <strong>자미성:</strong> ${BRANCHES_HANJA[ziweiPos]}궁<br>
      <strong>사화:</strong> <span style="color:#ff0">록</span>${SIHUA_TABLE[yearStem][0]} · <span style="color:#f90">권</span>${SIHUA_TABLE[yearStem][1]} · <span style="color:#0cf">과</span>${SIHUA_TABLE[yearStem][2]} · <span style="color:#f33">기</span>${SIHUA_TABLE[yearStem][3]}
    </div>
  </div>`;
}

function renderPalaceCell(branch, palaces, palaceStems, stars, mingGong, shenGong){
  const palaceIdx = palaces[branch];
  const palaceName = PALACE_HANJA[palaceIdx];
  const palaceNameKr = PALACE_NAMES[palaceIdx];
  const stem = palaceStems[branch];
  const branchStars = stars[branch] || [];

  let isMing = branch === mingGong;
  let isShen = branch === shenGong;

  let cellClass = 'palace-cell';
  if(isMing) cellClass += ' ming-gong';

  let starsHtml = '';
  // Main stars first
  const mainStars = branchStars.filter(s=>s.type==='main');
  const lucunStars = branchStars.filter(s=>s.type==='lucun');
  const auxStars = branchStars.filter(s=>s.type==='aux');
  const shaStars = branchStars.filter(s=>s.type==='sha');
  const miscStars = branchStars.filter(s=>s.type==='misc');

  function starHtml(s, baseClass){
    let bClass = '';
    if(s.brightness !== undefined) bClass = ' ' + BRIGHTNESS_CLASSES[s.brightness];
    let sihuaStr = '';
    if(s.sihua){
      s.sihua.forEach(si => {
        sihuaStr += `<span class="sihua-tag ${SIHUA_CLASSES[si]}">${SIHUA_NAMES[si]}</span>`;
      });
    }
    let brightLabel = '';
    if(s.brightness !== undefined) brightLabel = `<span style="font-size:0.55em;color:var(--text-dim)">${BRIGHTNESS_NAMES[s.brightness]}</span>`;
    return `<span class="star-tag ${baseClass}${bClass}">${s.name}${brightLabel}${sihuaStr}</span>`;
  }

  mainStars.forEach(s=>{starsHtml+=starHtml(s,'star-main');});
  lucunStars.forEach(s=>{starsHtml+=starHtml(s,'star-lucun');});
  auxStars.forEach(s=>{starsHtml+=starHtml(s,'star-aux');});
  shaStars.forEach(s=>{starsHtml+=starHtml(s,'star-sha');});
  miscStars.forEach(s=>{starsHtml+=starHtml(s,'star-misc');});

  let badges = '';
  if(isShen) badges += '<div class="singung-badge">身宮</div>';

  let nameStyle = isMing ? 'border-bottom:1px solid var(--accent);padding-bottom:2px;' : '';

  return `<div class="${cellClass}" style="${isMing?'border-color:var(--accent);background:rgba(233,69,96,0.05);':''}">
    <span class="stem-label">${STEMS_HANJA[stem]}</span>
    <span class="branch-label">${BRANCHES_HANJA[branch]}</span>
    <div class="palace-name" style="${nameStyle}">${palaceName}${isMing?' ★':''}</div>
    <div class="palace-name-kr">${palaceNameKr}</div>
    <div class="star-list">${starsHtml}</div>
    ${badges}
  </div>`;
}

  for(let si=0;si<4;si++){

  }
  if(lucunBranch === tianmaBranch && lucunBranch >= 0){
    html += '<p><span style="color:var(--gold);font-weight:700;">★ 록마교치(祿馬交馳)!</span> 록존과 천마가 같은 궁에 있어 재물운과 활동력이 매우 강합니다.</p>';
  }
  html += '</div>';

  // 대한(大限)
  const currentYear = new Date().getFullYear();
  const birthYear = sy;
  const currentAge = currentYear - birthYear + 1;

  html += '<div class="analysis-box"><h3>大限(대한) - 10년 대운</h3><div class="daehan-section"><table class="daehan-table"><thead><tr>';
  html += '<th>대한</th>';
  daehan.forEach(d=>{
    html += `<th>${d.fromAge}~${d.toAge}세</th>`;
  });
  html += '</tr></thead><tbody><tr><td>궁위</td>';
  daehan.forEach(d=>{
    const isCurrent = currentAge >= d.fromAge && currentAge <= d.toAge;
    html += `<td class="${isCurrent?'current':''}">${d.branchName}궁</td>`;
  });
  html += '</tr><tr><td>주성</td>';
  daehan.forEach(d=>{
    const dStars = (stars[d.branch]||[]).filter(s=>s.type==='main').map(s=>s.name).join('<br>');
    const isCurrent = currentAge >= d.fromAge && currentAge <= d.toAge;
    html += `<td class="${isCurrent?'current':''}" style="font-size:0.8em;">${dStars||'-'}</td>`;
  });
  html += '</tr><tr><td>사화</td>';
  daehan.forEach(d=>{
    const dSihua = (stars[d.branch]||[]).filter(s=>s.sihua).map(s=>s.sihua.map(si=>SIHUA_NAMES[si]).join('')+s.name).join('<br>');
    const isCurrent = currentAge >= d.fromAge && currentAge <= d.toAge;
    html += `<td class="${isCurrent?'current':''}" style="font-size:0.7em;">${dSihua||'-'}</td>`;
  });
  html += '</tr></tbody></table></div></div>';

  section.innerHTML = html;
}
</script>
