<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #F5F0E6; color: #2B2622; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 0 80px; gap: 40px; }
  .seal { width: 108px; height: 108px; }
  h1 { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 92px; letter-spacing: -2px; margin-top: 26px; }
  .sub { font-size: 34px; font-weight: 700; color: #B8352A; margin-top: 6px; }
  .lead { font-size: 28px; color: #5B534C; margin-top: 22px; line-height: 1.45; }
  .url { font-size: 24px; color: #6B635B; margin-top: 30px; letter-spacing: 0.5px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid .h { text-align: center; font-size: 22px; color: #6B635B; font-weight: 700; }
  .t { height: 118px; border-radius: 18px; display: grid; place-items: center; font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 70px; }
  .e0 { background: #D7F1DF; color: #216A39; } .e1 { background: #FFDED8; color: #B23927; } .e2 { background: #FFECB8; color: #9A6A10; }
  .e3 { background: #E5E8EB; color: #66727D; } .e4 { background: #DCE8FF; color: #184A96; }
  .card { background: #fff; border: 2px solid #E5DFD6; border-radius: 28px; padding: 28px; }
</style></head>
<body>
  <div>
    <svg class="seal" viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="9" fill="#B8352A"/><rect x="6.5" y="6.5" width="51" height="51" rx="6" fill="none" stroke="#F5F0E6" stroke-width="1.6" opacity=".85"/><text x="32" y="29" text-anchor="middle" font-family="Noto Serif KR, serif" font-weight="900" font-size="17" fill="#F5F0E6">인설</text><text x="32" y="49" text-anchor="middle" font-family="Noto Serif KR, serif" font-weight="900" font-size="17" fill="#F5F0E6">명리</text></svg>
    <h1>인설명리</h1>
    <div class="sub">사주팔자 &amp; 자미두수 명반</div>
    <div class="lead">만세력과 명반을 한곳에서, 무료로.<br>쉬운 말로 풀어 드려요.</div>
    <div class="url">app.inseol.com</div>
  </div>
  <div class="card">
    <div class="grid">
      <div class="h">시</div><div class="h">일</div><div class="h">월</div><div class="h">년</div>
      <div class="t e0">甲</div><div class="t e1">丙</div><div class="t e2">戊</div><div class="t e3">庚</div>
      <div class="t e4">子</div><div class="t e0">寅</div><div class="t e1">午</div><div class="t e3">申</div>
    </div>
  </div>
</body></html>
