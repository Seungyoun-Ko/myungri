:root {

body {

.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* 사주 요약 바 */
.saju-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 24px; }
.saju-bar .col { background: var(--surface); border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #333; }
.saju-bar .col-label { font-size: 0.7em; color: var(--text-dim); }
.saju-bar .col-stem { font-size: 1.4em; font-weight: 900; }
.saju-bar .col-branch { font-size: 1.4em; font-weight: 900; }

/* 운세 카드 */
.fortune-card {
  background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 16px;
  border: 1px solid #333; position: relative; overflow: hidden;
}
.fortune-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
}
.fortune-card.personality::before { background: var(--gold); }
.fortune-card.career::before { background: var(--water); }
.fortune-card.wealth::before { background: var(--earth); }
.fortune-card.love::before { background: var(--fire); }
.fortune-card.health::before { background: var(--wood); }
.fortune-card.yearly::before { background: var(--accent); }
.fortune-card.monthly::before { background: var(--metal); }
.fortune-card.advice::before { background: linear-gradient(var(--gold), var(--accent)); }

.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-icon { font-size: 1.5em; }
.card-title { font-size: 1.1em; font-weight: 700; color: var(--gold); }
.card-subtitle { font-size: 0.8em; color: var(--text-dim); }
.card-body { font-size: 0.92em; line-height: 1.7; color: #ddd; }
.card-body p { margin-bottom: 8px; }
.card-body .highlight { color: var(--gold); font-weight: 700; }
.card-body .warn { color: var(--accent); }

/* 점수 바 */
.score-bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.score-bar .label { font-size: 0.85em; min-width: 50px; }
.score-bar .bar { flex: 1; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
.score-bar .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.score-bar .val { font-size: 0.85em; min-width: 35px; text-align: right; }

/* 오행 관계 */
.oheng-rel { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.oheng-chip { padding: 4px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 500; }

.footer { text-align: center; padding: 20px; font-size: 0.75em; color: var(--text-dim); }

/* 구분선 */
.divider { border: none; border-top: 1px solid #333; margin: 24px 0; }

@media (max-width: 600px) {
  .container { padding: 12px; }
  .fortune-card { padding: 14px; }
}

const BRANCH_OHENG = [4,2,0,0,2,1,1,2,3,3,2,4];

const SIPSIN_NAME = ['비견','겁재','식신','상관','편재','정재','편관','정관','편인','정인'];

function getSipsin(dayStemIdx, targetStemIdx) {
  const relation = ((STEM_OHENG[targetStemIdx] - STEM_OHENG[dayStemIdx] + 5) % 5);
  const sameYY = (STEM_YINYANG[dayStemIdx] === STEM_YINYANG[targetStemIdx]) ? 0 : 1;
  return SIPSIN_NAME[relation * 2 + sameYY];
}

const mb = parseInt(params.get('mb'));

const db = parseInt(params.get('db'));

const hb = parseInt(params.get('hb'));
const gender = params.get('g') || 'M';
const birthYear = parseInt(params.get('y')) || 0;
const birthMonth = parseInt(params.get('m')) || 0;
